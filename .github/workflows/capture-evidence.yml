name: Capture Alamaar evidence

on:
  workflow_dispatch:
  push:
    paths:
      - 'capture/**'
      - '.github/workflows/capture-evidence.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

env:
  CI: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: capture
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capture/package.json

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots and recordings
        run: npm run capture

      - name: Capture focused hero montage
        run: npm run hero

      - name: Capture mobile Lighthouse evidence
        run: npm run audit

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alamaar-evidence-${{ github.run_number }}
          path: capture/evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish latest evidence to repository
        if: success() && github.event_name != 'workflow_dispatch'
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf evidence/bootstrap
          mkdir -p evidence/bootstrap
          cp -R capture/evidence/. evidence/bootstrap/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/bootstrap
          if git diff --cached --quiet; then
            echo "No capture changes to publish"
          else
            git commit -m "Store latest Alamaar capture evidence"
            git push
          fi
