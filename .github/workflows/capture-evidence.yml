name: Capture Alamaar evidence

on:
  workflow_dispatch:
  push:
    paths:
      - 'capture/**'
      - '.github/workflows/capture-evidence.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

env:
  CI: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: capture
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capture/package.json

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots and recordings
        run: npm run capture

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alamaar-evidence-${{ github.run_number }}
          path: capture/evidence
          if-no-files-found: warn
          retention-days: 14
