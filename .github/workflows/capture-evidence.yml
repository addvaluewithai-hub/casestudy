name: Capture Alamaar evidence

on:
  workflow_dispatch:
  push:
    paths:
      - 'capture/**'
      - '.github/workflows/capture-evidence.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

env:
  CI: true
  PORTFOLIO_PREVIEW_URL: https://feat-alamaar-rebuild-release.yasserhawas-preview.pages.dev

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: capture
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capture/package.json

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots and recordings
        id: capture
        continue-on-error: true
        run: npm run capture

      - name: Capture focused hero montage
        id: hero
        continue-on-error: true
        run: npm run hero

      - name: Capture mobile Lighthouse evidence
        id: audit
        continue-on-error: true
        run: npm run audit

      - name: QA portfolio branch preview
        id: portfolio
        continue-on-error: true
        run: npm run portfolio-qa

      - name: Write run status
        if: always()
        run: |
          mkdir -p evidence
          cat > evidence/run-status.json <<JSON
          {
            "capture": "${{ steps.capture.outcome }}",
            "hero": "${{ steps.hero.outcome }}",
            "audit": "${{ steps.audit.outcome }}",
            "portfolio": "${{ steps.portfolio.outcome }}",
            "run_number": "${{ github.run_number }}",
            "event": "${{ github.event_name }}"
          }
          JSON

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alamaar-evidence-${{ github.run_number }}
          path: capture/evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish latest evidence to repository
        if: always() && github.event_name != 'workflow_dispatch'
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf evidence/bootstrap
          mkdir -p evidence/bootstrap
          if [ -d capture/evidence ]; then
            cp -R capture/evidence/. evidence/bootstrap/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/bootstrap
          if git diff --cached --quiet; then
            echo "No capture changes to publish"
          else
            git commit -m "Store latest Alamaar capture evidence"
            git push
          fi

      - name: Fail job when a required capture failed
        if: always() && (steps.capture.outcome == 'failure' || steps.hero.outcome == 'failure' || steps.audit.outcome == 'failure' || steps.portfolio.outcome == 'failure')
        run: |
          echo "One or more evidence/QA steps failed. See evidence/run-status.json and portfolio-preview/report.json."
          exit 1
